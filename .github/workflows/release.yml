name: release

# A release is one click: run this workflow. It works out the next version from
# the commit subjects, writes the changelog, and opens a release pull request.
# When that pull request lands on main, the same workflow tags it and ships it —
# binaries, GitHub Release, crates.io.
#
# The bump cannot go straight to main: the "main requires ci" ruleset has no
# bypass actors, so every commit reaches main through a pull request that passed
# CI, the release commit included. That is the whole reason for the two steps.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0. Blank takes the next one from the commit subjects."
        required: false
        type: string
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step one, on the button. Everything here is mechanical, and the pull request
  # it opens is checked by CI like any other.
  open:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # With a RELEASE_TOKEN secret — a fine-grained PAT with contents and
      # pull-requests write — the release is one click and nothing else. Without
      # one the release still works, but two things need a hand: GITHUB_TOKEN
      # opens a pull request whose checks are held for "Approve workflows to
      # run", and the merge has to be yours (see below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - id: version
        # Through the environment, never interpolated into the script: a
        # workflow input is text somebody typed.
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED"
          # git-cliff reads the conventional commit subjects since the last tag
          # and decides whether they add up to a patch, a minor or a major.
          if [ -z "$version" ]; then
            version=$(git cliff --bumped-version | sed 's/^v//')
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a version: $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Bump the version and write the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Anchored inside [package] so a dependency's version is never the match.
          sed -i '/^\[package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          # Rewrites this package's entry in Cargo.lock and nothing else, so the
          # release commit cannot carry a silent dependency bump.
          cargo update --workspace
          git cliff --unreleased --tag "v$VERSION" --prepend CHANGELOG.md
          # The same read the release notes are cut with later. Failing here
          # costs a workflow run; failing after the merge would leave a tag
          # standing with no release behind it.
          if ! awk -v v="$VERSION" '
                $0 ~ "^## \\[" v "\\] - " { on = 1; next }
                /^## / || /^\[[^]]+\]: / { on = 0 }
                on' CHANGELOG.md | grep -q '^- '; then
            echo "nothing to release: no changelog entries for $VERSION"
            exit 1
          fi
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$VERSION"
          git commit -am "chore: release $VERSION"
          git push -u origin "release/v$VERSION"
          gh pr create --base main --head "release/v$VERSION" \
            --title "chore: release $VERSION" \
            --body "Merging this tags \`v$VERSION\` and ships it: binaries, GitHub Release, crates.io. The version and the changelog section come from the commit subjects since the last tag; nothing here was written by hand."
          # Auto-merge is only offered when there is a real token behind it.
          # GitHub raises no push event for anything GITHUB_TOKEN did, so an
          # auto-merge on GITHUB_TOKEN would land the release commit and then
          # quietly stop, leaving a bumped main with no tag and no release. A
          # merge you perform yourself raises the event and ships it.
          if [ "$HAS_TOKEN" = true ]; then
            gh pr merge --auto --squash "release/v$VERSION"
          else
            echo "No RELEASE_TOKEN set, so this pull request is left for you:"
            echo "  1. Approve its checks (\"Approve workflows to run\")."
            echo "  2. Merge it. That is what tags v$VERSION and ships it."
          fi

  # Step two, when that pull request lands. A version on main with no tag of its
  # own is what marks a release, so the tag is derived rather than remembered: a
  # re-run cannot tag twice, and a merge that changed no version does nothing.
  resolve:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ship: ${{ steps.resolve.outputs.ship }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcpdial") | .version')
          # A tag pushed by hand still works, and still has to name the version
          # in Cargo.toml.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            {
              echo "ship=true"
              echo "tag=$GITHUB_REF_NAME"
              echo "version=$version"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release"
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"
          {
            echo "ship=true"
            echo "tag=v$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  # CHANGELOG.md must have notes for the version; they become the release body.
  verify:
    needs: resolve
    if: needs.resolve.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] - " { on = 1; next }
            /^## / || /^\[[^]]+\]: / { on = 0 }
            on' CHANGELOG.md > notes.md
          if ! grep -q '^- ' notes.md; then
            echo "CHANGELOG.md has no entries under '## [$VERSION]'"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  # `build` compiles the working tree; this compiles the tarball crates.io would
  # actually receive, so a file the package leaves out fails on the pull request
  # rather than after the tag is cut. A dry run never reaches the registry, so it
  # cannot answer whether crates.io will accept the upload -- it checks the
  # package, not the metadata rules the server applies to it.
  package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: cargo publish --dry-run --locked

  build:
    needs: [resolve, verify]
    if: needs.resolve.outputs.ship == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          name=mcpdial-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/mcpdial
          if [ "${{ runner.os }}" = Windows ]; then bin=$bin.exe; fi
          test "$("$bin" --version)" = "mcpdial $VERSION"
          mkdir -p dist/$name
          cp "$bin" LICENSE README.md CHANGELOG.md dist/$name/
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip $name.zip $name
          else
            tar czf $name.tar.gz $name
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.ship == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file dist/notes.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS

  # A crates.io version can be yanked but never replaced or reused, so this runs
  # only once the binaries are built and the GitHub release exists. Auth is
  # crates.io Trusted Publishing: the job trades a GitHub OIDC token for one
  # scoped to this run, which the action revokes when the job ends. Nothing
  # long-lived is stored, so there is no registry token in this repository's
  # secrets. Configured at crates.io -> mcpdial -> Settings -> Trusted Publishing,
  # which names this workflow file; moving the job to another file breaks it.
  publish:
    needs: [resolve, release]
    if: needs.resolve.outputs.ship == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
