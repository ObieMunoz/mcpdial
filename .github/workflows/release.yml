name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must name the version in Cargo.toml, and CHANGELOG.md must have notes for it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcpdial") | .version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\] - " { on = 1; next }
            /^## / || /^\[[^]]+\]: / { on = 0 }
            on' CHANGELOG.md > notes.md
          if ! grep -q '^- ' notes.md; then
            echo "CHANGELOG.md has no entries under '## [$version]'"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  # `build` compiles the working tree; this compiles the tarball crates.io would
  # actually receive, so a file the package leaves out fails on the pull request
  # rather than after the tag is cut.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: cargo publish --dry-run --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcpdial") | .version')
          name=mcpdial-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/mcpdial
          if [ "${{ runner.os }}" = Windows ]; then bin=$bin.exe; fi
          test "$("$bin" --version)" = "mcpdial $version"
          mkdir -p dist/$name
          cp "$bin" LICENSE README.md CHANGELOG.md dist/$name/
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip $name.zip $name
          else
            tar czf $name.tar.gz $name
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/notes.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS

  # A crates.io version can be yanked but never replaced or reused, so this runs
  # only once the binaries are built and the GitHub release exists. Auth is
  # crates.io Trusted Publishing: the job trades a GitHub OIDC token for one
  # scoped to this run, which the action revokes when the job ends. Nothing
  # long-lived is stored, so there is no registry token in this repository's
  # secrets. Configured at crates.io -> mcpdial -> Settings -> Trusted Publishing.
  publish:
    if: github.ref_type == 'tag'
    needs: [package, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
