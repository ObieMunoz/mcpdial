name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debug info is never read in CI, and writing it (PDBs on Windows) dominates link time.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The agent surface has to be the same bytes with the terminal presentation
      # compiled out. A test target on its own does not build the examples, and
      # the contract test spawns one, so they are built first.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo build --no-default-features --examples
      - run: cargo test --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked --all-targets

  # The shape of catalog.json is checked by the unit tests in the test job. This
  # asks the live registry whether every entry that points at it still resolves
  # and converts to the transport it promises, which is the review gate for a
  # catalog change; it needs the network, so it runs on its own.
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --test catalog -- --ignored live_registry

  # Squash merges take the PR title as the commit subject, and the changelog is
  # generated from those subjects, so the title has to parse as a conventional commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|revert|docs|test|ci|chore|build|style)(\([^)]+\))?!?: [^ ].*'; then
            echo "PR title must be a conventional commit subject, e.g. 'feat: add X': $TITLE"
            exit 1
          fi
